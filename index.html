  var FILES = {toi: "toi.html", sang: "sang.html"};
  // dom id -> screen name, and screen name -> dom id, for each version.
  var nameOf = {}, domOf = {};
  Object.keys(SCREENS).forEach(function(m){
    nameOf[m] = {}; domOf[m] = {};
    SCREENS[m].forEach(function(p){ nameOf[m][p[0]] = p[1]; domOf[m][p[1]] = p[0]; });
  });

  var frame = document.getElementById("app");
  var loading = document.getElementById("loading");
  var buttons = [].slice.call(document.querySelectorAll("#mode button"));

  var params = new URLSearchParams(location.search);
  var mode = params.get("mode");
  if (!FILES[mode]) { try { mode = localStorage.getItem("koi-demo-mode"); } catch (e) {} }
  if (!FILES[mode]) mode = "toi";
  params.delete("mode");
  var pass = params.toString();
  pass = pass ? "?" + pass : "";

  function paint(){
    document.body.classList.toggle("sang", mode === "sang");
    buttons.forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === mode)); });
  }
  function remember(){
    try { localStorage.setItem("koi-demo-mode", mode); } catch (e) {}
    var q = new URLSearchParams(location.search); q.set("mode", mode);
    history.replaceState(null, "", "?" + q.toString());
  }
  function currentDom(){
    try { return decodeURIComponent(frame.contentWindow.location.hash.slice(1)); } catch (e) { return ""; }
  }
  function open(url, replace){
    loading.hidden = false;
    if (replace && frame.contentWindow) {
      try { frame.contentWindow.location.replace(url); return; } catch (e) {}
    }
    frame.src = url;
  }
  frame.addEventListener("load", function(){ loading.hidden = true; });

  buttons.forEach(function(b){
    b.addEventListener("click", function(){
      var next = b.getAttribute("data-mode");
      if (next === mode) return;
      var name = nameOf[mode][currentDom()];
      var target = name && domOf[next][name];
      mode = next;
      paint(); remember();
      open(FILES[next] + pass + (target ? "#" + target : ""), true);
    });
  });

  paint();
  open(FILES[mode] + pass, false);
})();
</script>
