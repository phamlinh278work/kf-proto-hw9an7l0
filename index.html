<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1e1e1e}
body.sang{background:#e5e5ea}
.app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:transparent;opacity:0;visibility:hidden;z-index:1;transition:opacity .22s ease}
.app.on{opacity:1;visibility:visible}
.app.top{z-index:2}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font:500 14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:rgba(255,255,255,.6);pointer-events:none;z-index:3}

#mode button{all:unset;cursor:pointer;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;color:rgba(255,255,255,.72);-webkit-tap-highlight-color:transparent;transition:background-color .22s ease,color .22s ease}
#mode button svg{width:15px;height:15px;flex:none}
#mode button[aria-pressed="true"]{background:#dc6e2d;color:#fff}
#mode button:focus-visible{outline:2px solid #fff;outline-offset:1px}
#mode.busy button[aria-pressed="true"] svg{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
body.sang #mode{background:rgba(255,255,255,.94);box-shadow:0 1px 6px rgba(0,0,0,.14)}
body.sang #mode button{color:#3a3a3c}
body.sang #mode button[aria-pressed="true"]{background:#d2571b;color:#fff}
body.sang #mode button:focus-visible{outline-color:#1c1c1e}
@media (max-width:600px){
  #mode{top:calc(5px + env(safe-area-inset-top));right:auto;left:50%;transform:translateX(-50%);font-size:11px;padding:2px}
  #mode button{padding:5px 10px;gap:4px}
  #mode button svg{width:12px;height:12px}
}
@media (prefers-reduced-motion: reduce){.app,#mode,#mode button{transition:none}#mode.busy button[aria-pressed="true"] svg{animation:none}}

  var FILES = {toi: "toi.html", sang: "sang.html"};
  var FADE_MS = 240;
  var OTHER = {toi: "sang", sang: "toi"};
  // dom id <-> screen name for each version, so a switch lands on the same screen.
  var nameOf = {}, domOf = {};
  Object.keys(SCREENS).forEach(function(m){
    nameOf[m] = {}; domOf[m] = {};
    SCREENS[m].forEach(function(p){ nameOf[m][p[0]] = p[1]; domOf[m][p[1]] = p[0]; });
  });

  var frames = {toi: document.getElementById("f-toi"), sang: document.getElementById("f-sang")};
  var loaded = {toi: false, sang: false};
  var started = {toi: false, sang: false};
  var loading = document.getElementById("loading");
  var pill = document.getElementById("mode");
  var buttons = [].slice.call(pill.querySelectorAll("button"));

  var params = new URLSearchParams(location.search);
  var mode = params.get("mode");
  if (!FILES[mode]) { try { mode = localStorage.getItem("koi-demo-mode"); } catch (e) {} }
  if (!FILES[mode]) mode = "toi";
  params.delete("mode");
  // The player's own toolbar sits over the phone's bottom buttons unless the window is wide.
  if (!params.has("clean") && window.innerWidth < 1100) params.set("clean", "1");
  var pass = params.toString();
  pass = pass ? "?" + pass : "";
  var pending = null; // version waiting to be shown once it has loaded

  function paint(){
    document.body.classList.toggle("sang", mode === "sang");
    buttons.forEach(function(b){ b.setAttribute("aria-pressed", String(b.getAttribute("data-mode") === mode)); });
  }
  function remember(){
    try { localStorage.setItem("koi-demo-mode", mode); } catch (e) {}
    var q = new URLSearchParams(location.search); q.set("mode", mode);
    history.replaceState(null, "", "?" + q.toString());
  }
  function currentDom(m){
    try { return decodeURIComponent(frames[m].contentWindow.location.hash.slice(1)); } catch (e) { return ""; }
  }
  // Each player keeps its own list of visited screens, so "back" works the same
  // in both versions and survives a switch. The player calls history.pushState
  // when it opens a screen and history.back() for a back button; both are taken
  // over here. Nothing is added to the browser's own history.
  var stacks = {toi: [], sang: []};
  var rawReplace = {};
  function install(m){
    try {
      var w = frames[m].contentWindow, H = w.history;
      if (H.__koi) return;
      H.__koi = true;
      var rep = H.replaceState.bind(H);
      rawReplace[m] = rep;
      stacks[m] = [w.location.hash.slice(1)];
      H.pushState = function(s, t, url){
        var d = decodeURIComponent(String(url || "").replace(/^#/, ""));
        var st = stacks[m];
        if (d && st[st.length - 1] !== d) st.push(d);
        rep(s, t, url);
      };
      H.back = function(){
        var st = stacks[m];
        if (st.length < 2) return;
        st.pop();
        rep(null, "", "#" + st[st.length - 1]);
        w.dispatchEvent(new PopStateEvent("popstate", {state: null}));
      };
    } catch (e) {}
  }
  // Move a loaded player to a screen without a reload: the player redraws on
  // popstate from the hash. The visited list comes along, mapped by screen name.
  function goTo(m, dom, fromStack){
    if (!dom) return;
    try {
      var w = frames[m].contentWindow;
      if (fromStack) {
        var mapped = fromStack.map(function(d){ return domOf[m][nameOf[OTHER[m]][d]]; }).filter(Boolean);
        if (!mapped.length || mapped[mapped.length - 1] !== dom) mapped.push(dom);
        stacks[m] = mapped;
      }
      if (w.location.hash.slice(1) === dom) return;
      (rawReplace[m] || w.history.replaceState.bind(w.history))(null, "", "#" + dom);
      w.dispatchEvent(new PopStateEvent("popstate", {state: null}));
    } catch (e) {}
  }
  function start(m, dom){
    if (started[m]) return;
    started[m] = true;
    frames[m].src = FILES[m] + pass + (dom ? "#" + dom : "");
  }
  function reveal(m){
    var inc = frames[m], out = frames[OTHER[m]];
    out.classList.remove("top");
    inc.classList.add("top", "on");
    inc.removeAttribute("aria-hidden"); inc.removeAttribute("tabindex");
    out.setAttribute("aria-hidden", "true"); out.setAttribute("tabindex", "-1");
    setTimeout(function(){ if (mode === m) out.classList.remove("on"); }, FADE_MS);
    pill.classList.remove("busy");
    loading.hidden = true;
    try { inc.contentWindow.focus(); } catch (e) {}
  }
  function onLoad(m){
    loaded[m] = true;
    install(m);
    if (pending === m) {
      pending = null;
      var o = OTHER[m];
      goTo(m, domOf[m][nameOf[o][currentDom(o)]], loaded[o] ? stacks[o] : null);
      reveal(m);
    }

    if (!started[OTHER[m]]) setTimeout(function(){ start(OTHER[m]); }, 1200);
  }

    frames[m].addEventListener("load", function(){ if (frames[m].getAttribute("src")) onLoad(m); });
  });

  buttons.forEach(function(b){
    b.addEventListener("click", function(){
      var next = b.getAttribute("data-mode");
      if (next === mode) return;
      var prev = mode;
      var target = domOf[next][nameOf[prev][currentDom(prev)]];
      mode = next;
      paint(); remember();
      if (loaded[next]) { pending = null; goTo(next, target, stacks[prev]); reveal(next); }
      else { pending = next; pill.classList.add("busy"); start(next, target); }
    });
  });

  paint();
  frames[OTHER[mode]].setAttribute("aria-hidden", "true");
  frames[OTHER[mode]].setAttribute("tabindex", "-1");
  pending = mode;
  start(mode, "");
})();
